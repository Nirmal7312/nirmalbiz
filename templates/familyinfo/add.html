{% extends 'base.html' %}

{% block title %} Add New Entry {% endblock %}

{% block styles %}
{{ block.super }}
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
  }

  .form-container {
    max-width: 500px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    animation: fadeIn 1s ease-in-out;
  }

  .form-container h3 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  .form-container label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #555;
  }

  .form-container input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    transition: border-color 0.3s;
  }

  .form-container input:focus {
    border-color: #007bff;
    outline: none;
  }

  .form-container button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .form-container button:hover {
    background-color: #0056b3;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
{% endblock %}

{% block body %}
<div class="form-container">
  <h3>Add New Person</h3>
  <form method="post" action="{% if data %}{% url 'edit' data.id %}{% else %}/familyinfo/add/{% endif %}">
    {% csrf_token %}

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter full name" value="{{ data.name|default:'' }}" required>

    <label for="number">Phone Number</label>
    <input type="text" id="number" name="number" placeholder="Enter phone number" value="{{ data.number|default:'' }}" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" placeholder="Enter age" value="{{ data.age|default:'' }}" required>

    <button type="submit">Submit</button>
  </form>
</div>
{% endblock %}
