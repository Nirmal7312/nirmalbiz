{% extends 'base.html' %}

{% block title %} Add New Entry {% endblock %}

{% block body %}
<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-center">Add New Person</h3>
    
    <form method="post" action="/familyinfo/add/">
      {% csrf_token %}

      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" name="name" id="name" class="form-control" placeholder="Enter full name" required>
      </div>

      <div class="mb-3">
        <label for="number" class="form-label">Phone Number</label>
        <input type="text" name="number" id="number" class="form-control" placeholder="Enter phone number" required>
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" name="age" id="age" class="form-control" placeholder="Enter age" required>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Submit</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
